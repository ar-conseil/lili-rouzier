<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Image de partage</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--encre); }
  .cadre { position: relative; width: 1200px; height: 630px; }
  .cadre img { position: absolute; right: 0; top: 0; width: 560px; height: 630px; object-fit: cover; object-position: 50% 14%; -webkit-mask: linear-gradient(to right, transparent, #000 35%); mask: linear-gradient(to right, transparent, #000 35%); }
  .cadre .signature { position: absolute; left: 72px; top: 170px; width: 640px; color: var(--craie); }
  .cadre p { position: absolute; left: 76px; bottom: 74px; font-family: "Switzer", sans-serif; font-size: 30px; color: #d8d0c6; }
  .cadre p b { font-weight: 500; color: var(--rose); }
</style></head>
<body><div class="cadre">
  <img src="../assets/img/lili-studio-pied-1200.webp" alt="">
  <span class="signature"></span>
  <p>Community manager <b>·</b> Hauts-de-France</p>
</div></body></html>
